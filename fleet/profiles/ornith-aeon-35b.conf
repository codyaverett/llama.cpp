# Ornith-1.0-35B AEON Ultimate Uncensored — Qwen3.5 MoE (~3B active/token).
#
# Transcribed from serve-ornith.sh + llama-ornith-aeon.service so this reproduces the
# known-good boot configuration exactly: one shard, layer-split across the whole rig, 131K ctx,
# one full-context slot. Too big for a single card, so the pool degrades to a pass-through.
#
# The AEON repo's own weights are NVFP4 (Blackwell-only); this is the community GGUF re-quant.
# Q4_K_M is the best PLAIN quant that repo ships (no Q5_K_M).
MODEL="$MODELS_DIR/ornith-aeon-35b-Q4_K_M.gguf"
ALIAS=ornith-aeon
CARDS_PER_SHARD=8
CTX=131072              # fits with f16 KV; for the full 256K set CACHE_TYPE=q8_0 and CTX=262144
PARALLEL=1              # single coding agent: one full-context slot beats 4x CTX/4
CACHE_TYPE=
MMAP=off                # 20 GB vs 31 GB RAM — mmap thrashes weight pages off the SATA SSD
ROUTING=ip_hash
EXTRA=""
