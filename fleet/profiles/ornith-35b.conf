# Ornith-1.0-35B (base) — Qwen3.5 MoE (~3B active/token), the stock agentic coder.
# Transcribed from serve-ornith.sh variant "base".
#
# CARDS_PER_SHARD=8 reproduces the known-good layout. Worth an experiment: at 23583 MiB the
# weights are only ~5.8 GiB/card across FOUR cards, which would give 2 shards and double the
# aggregate throughput. Drop CTX to ~32768 and set CACHE_TYPE=q8_0 if you try it.
MODEL="$MODELS_DIR/ornith-1.0-35b-Q5_K_M.gguf"
ALIAS=ornith
CARDS_PER_SHARD=8
CTX=131072
PARALLEL=1
CACHE_TYPE=
MMAP=off                # 23 GB vs 31 GB RAM
ROUTING=ip_hash
EXTRA=""
