# Ornith-1.5-35B-A3B — Qwen3.5 MoE (~3B active/token), the stock agentic coder, v1.5.
# Same qwen3_5_moe arch and Q5_K_M quant (23.6 GiB) as ornith-35b, so it layer-splits across
# the rig exactly like the 1.0 profiles. Reasoning model: --jinja + --reasoning-format auto so
# clients get reasoning_content and parsed tool_calls. Sampling = model card "general tasks".
#
# CTX is 65536 with q8_0 KV (not 131072 f16 like ornith-35b); originally sized to coexist with
# llama-qwen38-27b.service, which holds ~4.5 GB on every card: weights are ~3 GB/card and the
# only remaining headroom is compute buffers. Raise CTX once the rig is not shared.
# For a 4-card layout (2 shards, or leaving 4 cards for the 9B fleet) set CARDS_PER_SHARD=4;
# weights are then ~5.9 GB/card, which only fits with nothing else resident.
MODEL="$MODELS_DIR/ornith-1.5-35b-Q5_K_M.gguf"
ALIAS=ornith15-35b      # distinct id: the rustyclaw "ornith35" agent selects on it
CARDS_PER_SHARD=7          # 7 cards, leaving card 9 for llama-ornith15-9b.service (port 8097)
CTX=65536
PARALLEL=1
CACHE_TYPE=q8_0
MMAP=off                # 23.6 GB vs 31 GB RAM
ROUTING=ip_hash
EXTRA="--jinja --reasoning-format auto --temp 0.6 --top-p 0.95 --top-k 20"
