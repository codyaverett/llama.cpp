# Gemma-4-Rust-Coder — ~5B dense reasoning + vision Rust coder.
# Transcribed from serve-rust-coder.sh (which used -sm layer across 9 cards for a 4.7 GB model —
# exactly the case the fleet fixes: it fits on ONE card, so it becomes one shard per card).
#
# Budget: 4737 weights + 941 mmproj + KV/bufs, comfortably inside 8176 MiB.
MODEL="$MODELS_DIR/gemma-4-rust-coder-Q8_0.gguf"
MMPROJ="$MODELS_DIR/gemma-4-rust-coder-mmproj-BF16.gguf"
ALIAS=rust-coder
CARDS_PER_SHARD=1
CTX=16384               # model supports 131072; raise with CACHE_TYPE=q8_0 for bigger windows
PARALLEL=1
CACHE_TYPE=
MMAP=on                 # 5.6 GB incl. mmproj — shares one page-cache copy across all shards
ROUTING=ip_hash
EXTRA="--jinja"
