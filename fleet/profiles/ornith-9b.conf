# Ornith-1.0-9B — dense hybrid Qwen3.5 (`qwen35`) agentic coder, one shard per card.
#
# This is the profile the fleet exists for. The 9B fits on a single 8 GB Vega, so instead of
# one model pipelined across nine cards (nine cards, one doing work at a time) we run nine
# independent servers that all compute at once.
#
# Sizing: 32 layers but only 8 are full-attention (full_attention_interval=4); the other 24 are
# linear/recurrent with a fixed per-slot state independent of context length. Full-attn KV is
# 4 kv-heads x 256 head-dim x 8 layers = ~32 KB/token at f16, ~17 KB at q8_0. So 32K ctx costs
# only ~557 MiB, and 64K costs ~1114 MiB.
#
# CTX is the SHARD total and llama.cpp splits it evenly across the PARALLEL slots, so the
# per-request window is CTX/PARALLEL — that quotient, not CTX, is what a client sees as n_ctx
# and what an oversized prompt is rejected against. At the original 32768/2 it was 16384, which
# rustyclaw (advertising a 128K window) overran on a ~17.6K-token prompt. Raised to 65536/2 so
# each request gets 32K. Per-card VRAM measured before/after: 5955 -> 6647 MiB of 8176, so
# ~1.5 GiB headroom remains (the +692 is KV plus slightly larger compute buffers, a bit more
# than KV scaling alone predicts). Splitting the same total as 1x64K instead costs no additional
# VRAM if a single deep context ever matters more than concurrency.
MODEL="$MODELS_DIR/ornith-1.0-9b-Q4_K_M.gguf"
ALIAS=ornith            # same id the 35B profiles serve, so clients never change their config
CARDS_PER_SHARD=1
CTX=65536               # per shard, split across PARALLEL slots
PARALLEL=2              # 2 slots x 32K each
CACHE_TYPE=q8_0
# MMAP=off deliberately, despite the model fitting host RAM. Sharing one page-cache copy across
# shards sounds strictly better and is how this profile was first written — but an 8-shard run
# with MMAP=on wedged every llama-server in uninterruptible D state (unkillable by SIGKILL,
# load average 19 with the CPU 91% idle, VRAM still pinned), which is the signature of blocking
# on page faults inside the GPU driver rather than of CPU contention. Every long-standing
# serve-*.sh on this rig uses --no-mmap. Do not flip this back without testing at 2 shards first.
MMAP=off
ROUTING=ip_hash
# MEASURED CEILING — do not raise without re-running fleet/bench.sh.
#
# The binding constraint is CPU CORES, not GPUs. This host is a 4-core i3-9100, and each shard
# busy-waits on GPU synchronisation, so an actively-serving shard costs ~1 full core.
#
#   4 shards: wall time FLAT from 1->4 concurrent (7.58s -> 7.88s, +3% for 4x throughput). Clean.
#   8 shards: collapses. Requests time out, and afterwards three shards sit spinning at 80-91%
#             CPU each (266% of 400%) with NOTHING in flight — they never return to idle.
#             Oversubscribing 4 cores with 8 spinning processes is a positive-feedback stall.
#
# So the rig serves 4 concurrent requests well and 8 not at all. The other 4 good cards are
# better spent on a SECOND model (e.g. a 2-card gemma profile) than on more shards of this one.
MAX_SHARDS=4
# 4-core host, many shards: see the thread note in serve-shard.sh. Defaults (4 gen + 6 HTTP
# threads per shard) oversubscribe the CPU ~20x and requests stop returning entirely.
THREADS=1
THREADS_HTTP=2
EXTRA="--jinja"
