# Gemma-4 12B agentic/tool-calling coder (composer2.5-v2-tau2).
# Transcribed from serve-gemma-4-12B-agentic-fable5.sh.
#
# 12082 MiB over 2 cards = ~6041/card, ~2.1 GiB headroom each.
MODEL="$MODELS_DIR/gemma-4-12B-agentic-fable5-composer2.5-v2-tau2-Q8_0.gguf"
ALIAS=gemma-agentic-fable5
CARDS_PER_SHARD=2
CTX=16384               # Gemma-4 supports 131072; raise with CACHE_TYPE=q8_0 for bigger windows
PARALLEL=1
CACHE_TYPE=
MMAP=on                 # 12.7 GB fits host RAM; shards share one page-cache copy
ROUTING=ip_hash
EXTRA="--jinja"         # required for this model's tool-calling chat template
