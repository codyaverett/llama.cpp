# Gemma-4 12B uncensored coder (composer2.5-v1-heretic).
# Transcribed from serve-gemma-4-12B-coder-heretic.sh.
#
# That script asked for CTX=262144 on a layer-split across 9 cards. Per 2-card shard that is
# far too much KV, so this drops to 32768 with q8_0 KV — raise CARDS_PER_SHARD if you need the
# full window more than you need concurrency.
MODEL="$MODELS_DIR/gemma-4-12B-coder-fable5-composer2.5-v1-uncensored-heretic-Q8_0.gguf"
ALIAS=gemma-coder-heretic
CARDS_PER_SHARD=2
CTX=32768
PARALLEL=1
CACHE_TYPE=q8_0
MMAP=on
ROUTING=ip_hash
EXTRA="--jinja"
