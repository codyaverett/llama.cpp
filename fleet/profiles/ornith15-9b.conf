# Ornith-1.5-9B — dense hybrid Qwen3.5 (`qwen35`) agentic coder, one shard per card.
# Same architecture, layer count and quant as ornith-9b (Ornith-1.0), so all of the sizing,
# CPU-core ceiling and MMAP notes in ornith-9b.conf apply unchanged. Read that file first.
#
# What is new in 1.5: it is a REASONING model (opens every turn with <think>…</think>) and
# ships an adjusted chat template, so --jinja and --reasoning-format auto are required for
# clients to get reasoning_content + parsed tool_calls instead of raw tags in the text.
# Sampling defaults are the model card's "general tasks" recipe for the 9B.
#
# Verified 2026-09-15: sha256 matches ornith-ai/Ornith-1.5-9B-GGUF; loads in this build.
MODEL="$MODELS_DIR/ornith-1.5-9b-Q4_K_M.gguf"
ALIAS=ornith15-9b       # distinct id: the rustyclaw "ornith9" agent selects on it
CARDS_PER_SHARD=1
CTX=65536               # per shard, split across PARALLEL slots => 32K per request
PARALLEL=2
CACHE_TYPE=q8_0
MMAP=off                # see ornith-9b.conf — 8 shards with mmap wedged the driver
ROUTING=ip_hash
MAX_SHARDS=4            # measured CPU ceiling, see ornith-9b.conf; do not raise without bench.sh
THREADS=1
THREADS_HTTP=2
EXTRA="--jinja --reasoning-format auto --temp 1.0 --top-p 0.95 --top-k 20 --min-p 0.0 --presence-penalty 1.5"
