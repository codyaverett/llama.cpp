# DeepSeek-Coder-V2-Lite-Instruct — 16B/2.4B-active MoE coder.
# Transcribed from serve-deepseek-coder-lite.sh (which pinned HIP_DEVICES=0,1 by hand — the
# fleet generalises that to "2 cards per shard, as many shards as fit").
#
# 11302 MiB over 2 cards = ~5651/card, ~2.5 GiB headroom each.
MODEL="$MODELS_DIR/DeepSeek-Coder-V2-Lite-Instruct-Q5_K_M.gguf"
ALIAS=deepseek-coder-lite
CARDS_PER_SHARD=2
CTX=16384               # model supports 163840; raise with CACHE_TYPE=q8_0 for bigger windows
PARALLEL=1
CACHE_TYPE=
MMAP=on                 # 11.3 GB fits host RAM; shards share one page-cache copy
ROUTING=ip_hash
EXTRA=""
